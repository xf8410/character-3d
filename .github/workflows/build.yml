name: build3d

on:
  workflow_dispatch:        # 手动触发：在 Actions 页点 Run workflow
  push:
    paths:
      - 'gen.py'
      - 'check_parts.py'
      - 'views/**'
      - 'vendor/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --no-cache-dir pillow numpy

      - name: Generate index.html (多部件 Q 版实体建模)
        run: python3 gen.py

      - name: Verify silhouette matches reference
        run: python3 check_silhouette.py

      - name: Commit built artifact
        run: |
          git config user.email "ci@github.com"
          git config user.name "character-3d CI"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "ci: rebuild index.html from reference views"
            git push
          fi
